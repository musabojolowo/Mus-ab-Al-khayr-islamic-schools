<section class="section">
<form class="card" action="https://formsubmit.co/musabojolowo2006@gmail.com" method="POST" enctype="multipart/form-data" id="admissionForm">

  <input type="hidden" name="_captcha" value="false">
  <!-- After successful submit, FormSubmit will redirect the user to thank-you.html -->
  <input type="hidden" name="_next" value="thank-you.html">

  <h3>Student Information</h3>

  <label for="student_name">Student Full Name</label>
  <input id="student_name" type="text" name="student_name" placeholder="Student Full Name" required>

  <label for="dob">Date of Birth</label>
  <input id="dob" type="date" name="dob" required>

  <label for="class_applying">Class Applying For</label>
  <input id="class_applying" type="text" name="class_applying" placeholder="Class Applying For" required>

  <h3>Parent / Guardian</h3>

  <label for="parent_name">Parent / Guardian Name</label>
  <input id="parent_name" type="text" name="parent_name" placeholder="Parent / Guardian Name" required>

  <label for="phone">Phone Number</label>
  <input id="phone" type="tel" name="phone" placeholder="Phone Number" required>

  <label for="email">Email Address</label>
  <input id="email" type="email" name="email" placeholder="Email Address" required>

  <!-- Hidden field used by FormSubmit to know who to reply to (set by JS) -->
  <input type="hidden" name="_replyto" id="_replyto">
  <!-- Optional autoresponse message (configure FormSubmit to enable autoresponders if needed) -->
  <input type="hidden" name="_autoresponse" value="Thank you for your application. We have received your submission and will contact you soon.">

  <h3>Address</h3>

  <label for="address">Home Address</label>
  <textarea id="address" name="address" placeholder="Home Address" required></textarea>

  <h3>Student Passport Photo</h3>
  <label for="photo">Upload Passport Photo (jpg, png) — max 2MB</label>
  <input id="photo" type="file" name="photo" accept="image/*" required>
  <div id="photoPreview" style="margin-top:10px;"></div>


  <button type="submit">Submit Application</button>
